name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          # 首页 / 落地页
          cp -r site/. dist/
          # 把分析器本体放到 /app/ 下，与 site 保持同一份源码
          mkdir -p dist/app
          cp -r app/ui/. dist/app/
          touch dist/.nojekyll
          echo "---- dist ----"
          find dist -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 仓库没开 Pages 时自动开，省得手动去 Settings 点
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
